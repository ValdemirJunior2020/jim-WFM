[build]
  command = "mkdir -p dist && cp index.html app.js styles.css favicon.svg dist/"
  publish = "dist"

[[redirects]]
  from = "/dashboard/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"
